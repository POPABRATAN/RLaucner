[package]
name = "rlauncher"
version = "0.1.0"
edition = "2021"
description = "RLauncher - лаунчер для Minecraft на Rust"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.29", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
open = "5"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
